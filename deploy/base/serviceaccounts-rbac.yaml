apiVersion: v1
kind: ServiceAccount
metadata:
  name: central
  namespace: opencode-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: opencode-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-sandbox-manager
  namespace: opencode-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-sandbox-manager
  namespace: opencode-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: opencode-system
