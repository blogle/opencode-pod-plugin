namespace: opencode-sandboxes
baseDomain: opencode.example.com
listen: 0.0.0.0:8080
previewListen: 0.0.0.0:8081
statePath: /var/lib/opencode-sandbox/gateway.sqlite3
opencode:
  version: 1.18.3
  centralUrl: http://central.opencode-system.svc.cluster.local:4096
  publicUrl: https://app.opencode.example.com
runtime:
  image: ghcr.io/blogle/opencode-sandbox-runtime:1.18.3
  genericNixImage: ghcr.io/blogle/opencode-sandbox-nix:1.18.3
  gatewayUrl: http://gateway.opencode-system.svc.cluster.local:8080
checkpoint:
  path: /var/lib/opencode-sandbox/checkpoints
  periodicSeconds: 120
lifecycle:
  suspendAfterIdleSeconds: 3600
  readyTimeoutSeconds: 300
  pollSeconds: 30
  terminationGraceSeconds: 180
auth:
  mode: trusted-header
  identityHeader: X-Auth-Request-Email
  internalTokenFile: /run/opencode-gateway/token
projectsFile: /etc/opencode-sandbox/projects.yaml
