---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-control-plane
  namespace: opencode-system
spec:
  podSelector:
    matchExpressions:
      - key: opencode.dev/network-role
        operator: In
        values: ["central", "gateway"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              opencode.dev/ingress: "true"
      ports:
        - { protocol: TCP, port: 4096 }
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: central-to-gateway
  namespace: opencode-system
spec:
  podSelector:
    matchLabels:
      opencode.dev/network-role: gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              opencode.dev/network-role: central
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-central
