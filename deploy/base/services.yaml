apiVersion: v1
kind: Service
metadata:
  name: central
  namespace: opencode-system
spec:
  selector:
    app.kubernetes.io/name: central
  ports:
    - name: http
      port: 4096
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: opencode-system
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: api
      port: 8080
      targetPort: api
    - name: preview
      port: 8081
      targetPort: preview
