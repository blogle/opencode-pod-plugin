apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - certificate.yaml
  - ingress.yaml

configMapGenerator:
  - name: opencode-platform-config
    namespace: opencode-system
    behavior: replace
    files:
      - platform.yaml=config/platform.yaml
  - name: opencode-projects-config
    namespace: opencode-system
    behavior: replace
    files:
      - projects.yaml=config/projects.yaml

# Replace this placeholder with the exact commit SHA published by CI.
images:
  - name: ghcr.io/blogle/opencode-central
    newTag: REPLACE_WITH_COMMIT_SHA
  - name: ghcr.io/blogle/opencode-gateway
    newTag: REPLACE_WITH_COMMIT_SHA
