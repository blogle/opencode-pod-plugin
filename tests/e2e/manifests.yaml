apiVersion: v1
kind: Secret
metadata:
  name: adapter-internal-token
  namespace: opencode-system
type: Opaque
stringData:
  token: kind-e2e-adapter-token-rev2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: opencode-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: git-server }
  template:
    metadata:
      labels: { app: git-server }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: git-server
          image: ocws-e2e-git:rev2
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 1 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: opencode-system
spec:
  selector: { app: git-server }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: opencode-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-llm }
  template:
    metadata:
      labels: { app: fake-llm }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fake-llm
          image: ocws-e2e-llm:rev2
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 1 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: opencode-system
spec:
  selector: { app: fake-llm }
  ports: [{ name: http, port: 8080, targetPort: http }]
