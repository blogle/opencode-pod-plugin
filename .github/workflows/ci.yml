name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            runtime-plugin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            supervisor
      - uses: extractions/setup-just@v2

      - name: Install TypeScript dependencies
        run: |
          npm ci --prefix plugin
          npm ci --prefix runtime-plugin
      - name: Test
        run: just test
      - name: Static checks
        run: just check

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"
      - name: Render production base
        run: kustomize build deploy/base >/dev/null
      - name: Render kind overlay
        run: kustomize build deploy/kind >/dev/null
      - name: Render shared-base E2E overlay
        run: kustomize build tests/e2e >/dev/null
      - name: Render nandstorm PoC overlay
        run: kustomize build deploy/nandstorm >/dev/null
